name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "APP_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Tag builds must be signed with the upload key; set the ANDROID_KEYSTORE_* secrets."
            exit 1
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No signing keystore configured; the build is signed with the debug key."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease

      - name: Rename APK and bundle and write checksums
        run: |
          NAME="quiet-buddy-${APP_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          NAME_AAB="quiet-buddy-${APP_VERSION_NAME}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$NAME_AAB"
          sha256sum "$NAME_AAB" > "$NAME_AAB.sha256"

      - name: Write release notes
        run: |
          : > "$RUNNER_TEMP/notes.md"
          if [ "$SIGNED" != "true" ]; then
            echo "Signed with a debug key: for testing only." >> "$RUNNER_TEMP/notes.md"
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            quiet-buddy-${{ env.APP_VERSION_NAME }}.apk
            quiet-buddy-${{ env.APP_VERSION_NAME }}.apk.sha256
            quiet-buddy-${{ env.APP_VERSION_NAME }}.aab
            quiet-buddy-${{ env.APP_VERSION_NAME }}.aab.sha256
          generate_release_notes: true
          prerelease: ${{ env.SIGNED != 'true' }}
          body_path: ${{ runner.temp }}/notes.md

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: quiet-buddy-${{ env.APP_VERSION_NAME }}
          path: |
            quiet-buddy-${{ env.APP_VERSION_NAME }}.apk
            quiet-buddy-${{ env.APP_VERSION_NAME }}.apk.sha256
            quiet-buddy-${{ env.APP_VERSION_NAME }}.aab
            quiet-buddy-${{ env.APP_VERSION_NAME }}.aab.sha256
          retention-days: 14

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
